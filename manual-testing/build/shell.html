<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pingle Testing &amp; Knowledge Manual ({{TITLE_VERSION}})</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Pingle manual testing guide, sales presentation, user handbook, and developer release manual.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap">
<style>
:root{
  --ink:#0F172A; --ink-2:#3B4A61; --ink-3:#64748B;
  --ground:#F7F9FB; --panel:#FFFFFF; --rail:#EEF2F6;
  --glass:rgba(255,255,255,.72); --edge:rgba(15,23,42,.12); --edge-2:rgba(15,23,42,.07);
  --pom:#15803D; --pom-deep:#166534; --gold:#B45309; --teal:#0E7490; --indigo:#4F46E5;
  --ok:#15803D; --warn:#B45309; --crit:#BE123C;
  --code-bg:#EEF2F6; --code-ink:#0F5132;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 30px -14px rgba(11,18,32,.22);
  --display:'Fira Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --body:'Fira Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#F8FAFC; --ink-2:#B6C2D2; --ink-3:#94A3B8;
  --ground:#0B1220; --panel:#111A2B; --rail:#0E1626;
  --glass:rgba(17,26,43,.74); --edge:rgba(248,250,252,.13); --edge-2:rgba(248,250,252,.07);
  --pom:#22C55E; --pom-deep:#16A34A; --gold:#F59E0B; --teal:#38BDF8; --indigo:#A5B4FC;
  --ok:#22C55E; --warn:#F59E0B; --crit:#F43F5E;
  --code-bg:#17233A; --code-ink:#86EFAC;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ink:#F8FAFC; --ink-2:#B6C2D2; --ink-3:#94A3B8;
  --ground:#0B1220; --panel:#111A2B; --rail:#0E1626;
  --glass:rgba(17,26,43,.74); --edge:rgba(248,250,252,.13); --edge-2:rgba(248,250,252,.07);
  --pom:#22C55E; --pom-deep:#16A34A; --gold:#F59E0B; --teal:#38BDF8; --indigo:#A5B4FC;
  --ok:#22C55E; --warn:#F59E0B; --crit:#F43F5E;
  --code-bg:#17233A; --code-ink:#86EFAC;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  font-size:15.5px;line-height:1.68;-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:288px minmax(0,1fr);gap:0;min-height:100vh}
nav.side{
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 16px 60px;
  background:var(--rail);border-inline-end:1px solid var(--edge-2);
}
nav.side .sb{display:flex;align-items:center;gap:9px;font-weight:650;margin:0 0 4px;padding:0 8px}
nav.side .sb .mk{width:24px;height:24px;border-radius:7px;flex:none;position:relative;
  background:#0B1220;border:1px solid color-mix(in srgb,var(--pom) 55%,transparent)}
nav.side .sb .mk::after{content:"";position:absolute;inset:6px;border-radius:50%;
  border:2px solid #22C55E;border-left-color:transparent;border-bottom-color:transparent}
nav.side .ver{font-size:11px;color:var(--ink-3);padding:0 8px 14px;letter-spacing:.04em}
nav.side a{display:block;text-decoration:none;color:var(--ink-2);border-radius:8px;
  padding:6px 9px;font-size:13.5px;line-height:1.4;transition:background .15s,color .15s}
nav.side a:hover{background:var(--glass);color:var(--pom)}
nav.side a.n1{font-weight:650;color:var(--ink);margin-top:14px;font-size:13px;
  letter-spacing:.03em}
nav.side a.n2{padding-inline-start:18px}
nav.side a.active{color:var(--pom);background:color-mix(in srgb,var(--pom) 10%,transparent)}
main{padding:0 0 90px;min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:11px 34px;background:var(--glass);border-bottom:1px solid var(--edge-2);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.topbar .crumb{font-size:13px;color:var(--ink-3);margin-inline-end:auto}
.topbar button,.topbar a.btn{font:inherit;font-size:13px;color:var(--ink);cursor:pointer;
  background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:6px 12px;
  text-decoration:none}
.topbar button:hover,.topbar a.btn:hover{border-color:var(--pom);color:var(--pom)}
.doc{max-width:900px;margin:0 auto;padding:34px 34px 0}
.doc h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.4vw,44px);
  line-height:1.12;letter-spacing:-.015em;margin:56px 0 20px;text-wrap:balance;
  padding-bottom:14px;border-bottom:2px solid color-mix(in srgb,var(--pom) 40%,transparent)}
.doc h1:first-child{margin-top:8px}
.doc h2{font-family:var(--display);font-weight:650;font-size:clamp(23px,3vw,31px);
  margin:48px 0 14px;letter-spacing:-.01em;text-wrap:balance}
.doc h3{font-size:19px;font-weight:650;margin:34px 0 10px;letter-spacing:-.005em}
.doc h4{font-size:16px;font-weight:650;margin:26px 0 8px;color:var(--ink-2)}
.doc h5,.doc h6{font-size:14px;font-weight:650;margin:20px 0 6px;color:var(--ink-2)}
.anchor{opacity:0;margin-inline-start:8px;color:var(--pom);text-decoration:none;font-size:.7em;
  transition:opacity .15s}
h1:hover .anchor,h2:hover .anchor,h3:hover .anchor{opacity:.55}
.doc p{margin:0 0 15px;max-width:74ch}
.doc ul,.doc ol{margin:0 0 16px;padding-inline-start:22px}
.doc li{margin-bottom:6px;max-width:72ch}
.doc a{color:var(--pom);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--pom) 32%,transparent)}
.doc a:hover{border-bottom-color:var(--pom)}
.doc hr{border:0;border-top:1px solid var(--edge-2);margin:34px 0}
code{font-family:var(--mono);font-size:.875em;background:var(--code-bg);color:var(--code-ink);
  padding:.14em .4em;border-radius:5px;border:1px solid var(--edge-2);word-break:break-word}
pre.code{background:var(--code-bg);border:1px solid var(--edge-2);border-radius:12px;
  padding:16px 18px;overflow-x:auto;margin:0 0 18px;line-height:1.5}
pre.code code{background:none;border:0;padding:0;color:var(--ink);font-size:13px}
figure.diagram{margin:0 0 20px;padding:18px;border:1px solid var(--edge-2);border-radius:14px;
  background:var(--panel);overflow-x:auto}
figure.diagram pre.mermaid{margin:0;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);
  white-space:pre;line-height:1.5}
.tw{overflow-x:auto;margin:0 0 20px;border:1px solid var(--edge);border-radius:12px;
  background:var(--panel);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px}
thead th{background:color-mix(in srgb,var(--pom) 7%,transparent);font-weight:650;
  color:var(--ink);padding:11px 14px;border-bottom:1px solid var(--edge);
  white-space:nowrap;font-size:13px;letter-spacing:.01em}
tbody td{padding:10px 14px;border-bottom:1px solid var(--edge-2);vertical-align:top;
  color:var(--ink-2);font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--pom) 4%,transparent)}
td strong,th strong{color:var(--ink)}
blockquote{margin:0 0 18px;padding:2px 0 2px 18px;border-inline-start:3px solid var(--edge);
  color:var(--ink-2)}
.alert{margin:0 0 20px;padding:16px 18px;border-radius:13px;border:1px solid var(--edge);
  border-inline-start-width:3px;background:var(--panel);box-shadow:var(--shadow)}
.alert p{margin:0 0 9px;max-width:70ch}
.alert p:last-child{margin-bottom:0}
.alert-h{font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  display:flex;align-items:center;gap:7px}
.a-note{border-inline-start-color:var(--teal)}       .a-note .alert-h{color:var(--teal)}
.a-tip{border-inline-start-color:var(--ok)}          .a-tip .alert-h{color:var(--ok)}
.a-important{border-inline-start-color:var(--indigo)}.a-important .alert-h{color:var(--indigo)}
.a-warning{border-inline-start-color:var(--warn)}    .a-warning .alert-h{color:var(--warn)}
.a-caution{border-inline-start-color:var(--crit)}    .a-caution .alert-h{color:var(--crit)}
.doc div[align="center"]{text-align:center;margin:44px 0 26px}
.doc div[align="center"] h1{border:0;padding:0;margin:0 0 6px}
.doc div[align="center"] table{margin:0 auto;width:auto}
.doc sub{color:var(--ink-3);font-size:12.5px}
@media (max-width:1000px){
  .shell{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-inline-end:0;border-bottom:1px solid var(--edge-2);
    max-height:230px}
  .doc{padding:24px 20px 0} .topbar{padding:10px 20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
:target{scroll-margin-top:70px}

/* ── sidebar search (generated edition) ─────────────────────────────── */
nav.side .find{position:sticky;top:0;z-index:2;background:var(--rail);padding:0 8px 10px}
nav.side .find input{width:100%;font:inherit;font-size:13px;color:var(--ink);
  background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:7px 10px}
nav.side .find input::placeholder{color:var(--ink-3)}
nav.side .find input:focus{outline:2px solid var(--pom);outline-offset:1px;border-color:transparent}
nav.side a[hidden]{display:none}
nav.side .nohit{display:none;font-size:12.5px;color:var(--ink-3);padding:6px 9px}
nav.side .nohit.on{display:block}
</style>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Contents">
    <p class="sb"><span class="mk" aria-hidden="true"></span> Pingle Testing Manual</p>
    <p class="ver">{{VERSION}} · internal</p>
    <div class="find">
      <input id="navfind" type="search" placeholder="Filter contents…" aria-label="Filter contents" autocomplete="off">
    </div>
{{NAV}}
    <p class="nohit" id="nohit">No section matches.</p>
  </nav>
  <main>
    <div class="topbar">
      <span class="crumb">pingle / pingletest / manual-testing / <strong>guide ({{VERSION}})</strong></span>
      <button id="theme" type="button" aria-label="Toggle light/dark theme">🌓 Theme</button>
      <a class="btn" href="javascript:window.print()">🖨️ Print / PDF</a>
    </div>
    <article class="doc">
{{BODY}}
    </article>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
const root=document.documentElement;
try{const t=localStorage.getItem('pingle_guide_theme'); if(t==='dark'||t==='light') root.setAttribute('data-theme',t);}catch(e){}

// ── mermaid ───────────────────────────────────────────────────────────
// Diagrams are emitted as pre.mermaid blocks. Without this init they render
// as raw text — which is exactly what the hand-maintained edition did.
function mermaidTheme(){
  const dark = (root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark';
  return dark ? 'dark' : 'default';
}
if(window.mermaid){
  mermaid.initialize({startOnLoad:true, theme:mermaidTheme(), securityLevel:'strict'});
}

document.getElementById('theme').addEventListener('click',()=>{
  const cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next=cur==='dark'?'light':'dark';
  root.setAttribute('data-theme',next);
  try{localStorage.setItem('pingle_guide_theme',next)}catch(e){}
});

// ── sidebar filter ────────────────────────────────────────────────────
const find=document.getElementById('navfind');
const nohit=document.getElementById('nohit');
const navLinks=[...document.querySelectorAll('nav.side a')];
find.addEventListener('input',()=>{
  const q=find.value.trim().toLowerCase();
  let shown=0;
  navLinks.forEach(a=>{
    const hit = q==='' || a.textContent.toLowerCase().includes(q);
    a.hidden = !hit;
    if(hit) shown++;
  });
  nohit.classList.toggle('on', shown===0);
});

// ── highlight the section currently in view ───────────────────────────
const links=navLinks;
const map=new Map(links.map(a=>[a.getAttribute('href').slice(1),a]));
const io=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    links.forEach(l=>l.classList.remove('active'));
    const a=map.get(e.target.id); if(a){a.classList.add('active');
      if(a.offsetTop < a.parentElement.scrollTop || a.offsetTop > a.parentElement.scrollTop+a.parentElement.clientHeight)
        a.scrollIntoView({block:'nearest'});}
  } });
},{rootMargin:'-70px 0px -75% 0px',threshold:0});
document.querySelectorAll('h1[id],h2[id]').forEach(h=>io.observe(h));
</script>
</body>
</html>
